<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>人與社會｜教師社團</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ============================================================
       index.html — 分頁式主頁（Tab shell）
       上方一排 Tab（js/tabs.js 依 data.js 產生），下方就地切換內容面板。
       每個 Tab 有自己的網址：index.html?tab=<id>，可以直接分享。
       ============================================================ */
    body {
      background: var(--paper);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(61,77,104,0.045), transparent 70%),
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(61,77,104,0.045), transparent 70%);
    }

    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: var(--sp-9) var(--sp-12) var(--sp-15);
    }

    /* ---- masthead ---- */
    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--sp-7);
      align-items: end;
      padding-bottom: var(--sp-7);
      border-bottom: 1px solid var(--rule);
    }
    .masthead-kicker {
      font-family: var(--font-sans);
      font-size: var(--fs-eyebrow);
      letter-spacing: var(--ls-kicker);
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--sp-4);
      font-weight: 500;
    }
    .masthead-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(38px, 5.4vw, 56px);
      letter-spacing: 0.14em;
      margin: 0 0 var(--sp-2);
      color: var(--ink);
      line-height: 1.1;
      padding-left: 0.14em;
    }
    .masthead-sub {
      font-family: var(--font-latin-italic);
      font-style: italic;
      font-size: clamp(28px, 3.5vw, 38px);
      color: var(--ink-muted);
      margin: 0;
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .masthead-meta {
      font-family: var(--font-sans);
      font-size: var(--fs-small);
      color: var(--ink-muted);
      text-align: right;
      line-height: 2;
    }
    .masthead-meta .label {
      letter-spacing: var(--ls-caps);
      text-transform: uppercase;
      font-size: var(--fs-eyebrow);
      color: var(--ink-faint);
      margin-right: var(--sp-2);
    }
    .masthead-meta .val {
      color: var(--ink);
      font-feature-settings: "tnum";
      font-weight: 500;
    }

    /* ---- tagline strip ---- */
    .tagline {
      padding: var(--sp-8) 0 var(--sp-2);
      max-width: 720px;
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 2;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin: 0;
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .tagline .lead-line {
      display: block;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 0 0 var(--sp-4);
      line-height: 1.6;
    }

    /* ---- panel header ---- */
    .sec-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: var(--sp-7);
      align-items: end;
      margin-bottom: var(--sp-4);
    }
    .sec-num {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 64px;
      line-height: 0.9;
      color: var(--accent);
      font-feature-settings: "tnum";
    }
    .sec-eyebrow {
      font-family: var(--font-sans);
      font-size: var(--fs-eyebrow);
      letter-spacing: var(--ls-kicker);
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 var(--sp-2);
    }
    .sec-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(26px, 3.2vw, 34px);
      letter-spacing: 0.1em;
      margin: 0;
      color: var(--ink);
      line-height: 1.2;
    }
    .sec-count {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--ink-faint);
      white-space: nowrap;
    }
    .sec-count strong {
      font-size: 26px;
      font-weight: 400;
      color: var(--accent);
      margin-right: 4px;
      font-feature-settings: "tnum";
    }
    .sec-rule {
      height: 1px;
      background: var(--rule);
      border: none;
      margin: 0 0 var(--sp-6);
    }
    .sec-note {
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.95;
      letter-spacing: 0.04em;
      color: var(--ink-2);
      max-width: 46em;
      margin: 0 0 var(--sp-8);
    }

    /* ---- cards ---- */
    .cards { display: flex; flex-direction: column; gap: var(--sp-4); }
    .cards--grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--sp-4);
    }
    .card {
      position: relative;
      display: block;
      padding: var(--sp-6) var(--sp-7);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--accent);
      border-radius: var(--r-2);
      background: var(--paper);
      color: inherit;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    a.card:hover {
      background: var(--paper-2);
      border-color: var(--rule-2);
      border-left-color: var(--accent);
      transform: translateX(2px);
    }
    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--sp-5);
      flex-wrap: wrap;
    }
    .card-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.05em;
      color: var(--ink);
      margin: 0;
      line-height: 1.5;
      transition: color 140ms ease;
    }
    a.card:hover .card-title { color: var(--accent); }
    .card-meta {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      letter-spacing: var(--ls-wide);
      color: var(--ink-faint);
      white-space: nowrap;
      font-feature-settings: "tnum";
    }
    .card-desc {
      font-family: var(--font-serif);
      font-size: 14.5px;
      line-height: 1.9;
      letter-spacing: 0.03em;
      color: var(--ink-muted);
      margin: var(--sp-3) 0 0;
      max-width: 46em;
    }
    .card-cta {
      display: inline-block;
      margin-top: var(--sp-4);
      font-family: var(--font-sans);
      font-size: var(--fs-eyebrow);
      letter-spacing: var(--ls-caps);
      text-transform: uppercase;
      color: var(--accent);
    }
    .card--feature { border-left-width: 4px; background: var(--paper-2); }

    /* ---- friday panel ---- */
    .fri-lede {
      border: 1px solid var(--rule);
      border-radius: var(--r-2);
      background: var(--paper-2);
      padding: var(--sp-6) var(--sp-7);
      margin-bottom: var(--sp-8);
    }
    .fri-when {
      font-family: var(--font-sans);
      font-size: var(--fs-small);
      letter-spacing: var(--ls-wide);
      color: var(--accent);
      margin: 0 0 var(--sp-4);
    }
    .fri-when .dot { color: var(--rule-2); margin: 0 var(--sp-3); }
    .fri-theme {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.1em;
      color: var(--ink);
      margin: 0 0 var(--sp-4);
    }
    .fri-intro {
      font-family: var(--font-serif);
      font-size: 15.5px;
      line-height: 2;
      letter-spacing: 0.04em;
      color: var(--ink-2);
      margin: 0;
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .fri-closing {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: var(--sp-5) 0 0;
    }
    .week-tag {
      font-family: var(--font-sans);
      font-size: var(--fs-eyebrow);
      letter-spacing: var(--ls-caps);
      color: var(--paper);
      background: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .card--skip { border-left-color: var(--rule-2); background: transparent; }
    .card--skip .week-tag { background: var(--rule-2); }
    .card--skip .card-title { color: var(--ink-muted); }
    .week-sub {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--ink);
      margin: var(--sp-4) 0 0;
    }
    .week-poem {
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 2.1;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      white-space: pre-wrap;
      margin: var(--sp-4) 0 0;
      padding-left: var(--sp-5);
      border-left: 1px solid var(--rule);
    }
    .week-poem-src {
      display: block;
      margin-top: var(--sp-3);
      font-size: 13px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }
    .week-closing {
      font-family: var(--font-serif);
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: var(--sp-4) 0 0;
    }
    .week-link {
      display: inline-block;
      margin-top: var(--sp-4);
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      letter-spacing: var(--ls-wide);
      color: var(--accent);
      border-bottom: 1px solid var(--rule-2);
      padding-bottom: 1px;
    }
    .week-link:hover { color: var(--hs-indigo-deep); border-bottom-color: var(--accent); }
    .week-link + .week-link { margin-left: var(--sp-5); }

    /* ---- empty ---- */
    .empty {
      font-family: var(--font-serif);
      font-size: 15px;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      padding: var(--sp-9) 0;
      border-top: 1px dashed var(--rule);
      border-bottom: 1px dashed var(--rule);
      text-align: center;
    }

    /* ---- colophon ---- */
    .colophon {
      margin-top: var(--sp-14);
      padding-top: var(--sp-9);
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--sp-6);
      align-items: end;
    }
    .colophon .school {
      font-family: var(--font-serif);
      font-size: 15px;
      letter-spacing: 0.18em;
      color: var(--ink-2);
    }
    .colophon .school .en {
      display: block;
      font-family: var(--font-latin-book);
      font-style: italic;
      letter-spacing: 0.02em;
      color: var(--ink-faint);
      font-size: 13px;
      margin-top: 4px;
    }
    .colophon .stamp {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      color: var(--ink-faint);
      letter-spacing: var(--ls-caps);
      text-transform: uppercase;
      text-align: right;
      line-height: 1.9;
    }
    .colophon .stamp strong { color: var(--ink-muted); font-weight: 400; }

    @media (max-width: 900px) {
      .page { padding: var(--sp-7) var(--sp-7) var(--sp-13); }
      .masthead { grid-template-columns: 1fr; gap: var(--sp-5); align-items: start; }
      .masthead-meta { text-align: left; }
      .sec-head { grid-template-columns: auto 1fr; row-gap: var(--sp-3); }
      .sec-num { font-size: 46px; }
      .sec-count { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
      .page { padding: var(--sp-6) var(--sp-5) var(--sp-11); }
      .sec-num { display: none; }
      .card { padding: var(--sp-5); }
      .fri-lede { padding: var(--sp-5); }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="masthead">
      <div>
        <p class="masthead-kicker">Ci-Xin Waldorf · Teacher Circle</p>
        <h1 class="masthead-title">人與社會</h1>
        <p class="masthead-sub">Human &amp; Society</p>
      </div>
      <div class="masthead-meta">
        <div><span class="label">Items</span><span class="val" id="metaCount">—</span></div>
        <div><span class="label">Sections</span><span class="val" id="metaCats">—</span></div>
        <div><span class="label">Updated</span><span class="val" id="metaUpdated">—</span></div>
      </div>
    </header>

    <p class="tagline">
      <span class="lead-line">從台灣出發，與世界建立連結</span>
      人與社會工作小組的文件與共同學習紀錄，依主題收於下方分頁。點選任一分頁，看該主題的內容。
    </p>

    <nav class="hs-tabs" id="hsTabs" data-mode="inline" aria-label="主題分頁"></nav>

    <main id="panel"></main>

    <footer class="colophon">
      <div class="school">
        慈心華德福高中
        <span class="en">Ci-Xin Waldorf School · Yilan</span>
      </div>
      <div class="stamp">
        人與社會教師社團<br />
        <strong id="metaUpdatedFoot">Updated —</strong>
      </div>
    </footer>
  </div>

  <script src="data.js"></script>
  <script>
    // 面板渲染：聽 js/tabs.js 派發的 hs:tabchange，就地換內容。
    // （這支必須在 tabs.js 之前載入——tabs.js 會在初始化時立刻派發一次事件。）
    (function () {
      const { CATEGORIES, META, urlFor } = window.DATA;

      const totalItems = CATEGORIES.reduce((s, c) => s + c.items.length, 0);
      const fmtDate = d => (d || '').replace(/-/g, ' / ');
      document.getElementById('metaCount').textContent = totalItems + ' 件';
      document.getElementById('metaCats').textContent = CATEGORIES.length + ' 類';
      document.getElementById('metaUpdated').textContent = fmtDate(META.updated);
      document.getElementById('metaUpdatedFoot').textContent = 'Updated ' + fmtDate(META.updated);

      const panel = document.getElementById('panel');

      document.addEventListener('hs:tabchange', e => render(e.detail.id));

      function render(id) {
        const cat = CATEGORIES.find(c => c.id === id);
        if (!cat) return;
        document.title = cat.title + ' · 人與社會｜教師社團';

        const count = cat.kind === 'links'
          ? (cat.links || []).length
          : (cat.friday ? (cat.friday.weeks || []).filter(w => !w.status).length : cat.items.length);
        const unit = cat.kind === 'links' ? '個' : (cat.friday ? '場' : '件');

        panel.innerHTML = `
          <header class="sec-head">
            <div class="sec-num">${cat.num}</div>
            <div>
              <p class="sec-eyebrow">Section ${cat.num} · ${esc(cat.subtitle)}</p>
              <h2 class="sec-title">${esc(cat.title)}</h2>
            </div>
            <p class="sec-count"><strong>${count}</strong>${unit}</p>
          </header>
          <hr class="sec-rule" />
          <p class="sec-note">${esc(cat.note)}</p>
          ${body(cat)}
        `;
      }

      function body(cat) {
        if (cat.friday) return fridayBody(cat);
        if (cat.kind === 'links') return linksBody(cat);
        return filesBody(cat);
      }

      // 純連結分類（資源連結）：簡單卡片＋一句說明
      function linksBody(cat) {
        const links = cat.links || [];
        if (!links.length) return emptyBox();
        return `<div class="cards cards--grid">` + links.map(l => `
          <a class="card" href="${esc(l.href)}" target="_blank" rel="noopener">
            <div class="card-head">
              <h3 class="card-title">${esc(l.title)}</h3>
              <span class="card-meta">↗</span>
            </div>
            <p class="card-desc">${esc(l.desc)}</p>
          </a>
        `).join('') + `</div>`;
      }

      // 文章分類：Drive 拉下來的 HTML 文章；有 pageLink 的再加一張入口卡
      function filesBody(cat) {
        const feature = cat.pageLink ? `
          <a class="card card--feature" href="${esc(cat.pageLink.href)}">
            <div class="card-head">
              <h3 class="card-title">${esc(cat.pageLink.label)}</h3>
              <span class="card-meta">→</span>
            </div>
            <p class="card-desc">${esc(cat.pageLink.desc)}</p>
          </a>` : '';
        const items = cat.items.map(item => `
          <a class="card" href="${urlFor(cat, item)}">
            <div class="card-head">
              <h3 class="card-title">${esc(item.title)}</h3>
              <span class="card-meta">${esc(item.date)}${item.size ? ' · ' + esc(item.size) : ''}</span>
            </div>
            <p class="card-desc">${esc(item.desc)}</p>
          </a>
        `).join('');
        if (!feature && !items) return emptyBox();
        return `<div class="cards">${feature}${items}</div>`;
      }

      // 週五活動：季度說明＋一週一張卡片
      function fridayBody(cat) {
        const f = cat.friday;
        const lede = `
          <div class="fri-lede">
            <p class="fri-when">${esc(f.when)}<span class="dot">·</span>${esc(f.where)}<span class="dot">·</span>${esc(f.span)}</p>
            <p class="fri-theme">${esc(f.season)}主題：${esc(f.theme)}</p>
            <p class="fri-intro">${esc(f.intro)}</p>
            <p class="fri-closing">${esc(f.closing)}</p>
          </div>`;
        const weeks = (f.weeks || []).map(w => {
          if (w.status) {
            return `
              <div class="card card--skip">
                <div class="card-head">
                  <h3 class="card-title"><span class="week-tag">${esc(w.week)}</span>　${esc(w.status)}</h3>
                  <span class="card-meta">${esc(w.date || '')}</span>
                </div>
              </div>`;
          }
          return `
            <div class="card">
              <div class="card-head">
                <h3 class="card-title"><span class="week-tag">${esc(w.week)}</span>　${esc(w.title)}</h3>
                <span class="card-meta">${esc(w.date || '')}</span>
              </div>
              ${w.subtitle ? `<p class="week-sub">${esc(w.subtitle)}</p>` : ''}
              ${w.lines && w.lines.length ? `<p class="week-poem">${esc(w.lines.join('\n'))}<span class="week-poem-src">——${esc(w.linesSource || '')}</span></p>` : ''}
              ${w.closing ? `<p class="week-closing">${esc(w.closing)}</p>` : ''}
              ${w.link ? `<a class="week-link" href="${esc(w.link)}" target="_blank" rel="noopener">${esc(w.linkLabel || '連結')} ↗</a>` : ''}
              ${w.notes ? `<a class="week-link" href="${urlFor(cat, w.notes)}">${esc(w.notes.label || '對話紀錄')} →</a>` : ''}
            </div>`;
        }).join('');
        const files = cat.items.length ? filesBody(cat) : '';
        return lede + `<div class="cards">${weeks}</div>` + files;
      }

      function emptyBox() {
        return `<p class="empty">這一區的內容還在準備中。</p>`;
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
    })();
  </script>
  <script src="js/tabs.js"></script>
  <script src="js/toolbar.js" defer></script>
</body>
</html>
