<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>分類 · 人與社會</title>
  <link rel="stylesheet" href="styles.css" />
  <!--
    2026-08-27：分類頁併入主頁的分頁（Tab）之後，本頁只留一個轉址殼——
    先前流出去的 category.html?cat=cXX 連結（LINE、書籤）仍然打得開，
    會自動轉到 index.html?tab=cXX。內容渲染只保留主頁那一份，不再有兩套。
  -->
  <script>
    (function () {
      var cat = new URLSearchParams(location.search).get('cat');
      var to = 'index.html' + (cat ? '?tab=' + encodeURIComponent(cat) : '');
      location.replace(to);
    })();
  </script>
  <style>
    .redirect-note {
      max-width: 640px;
      margin: 18vh auto 0;
      padding: 0 var(--sp-7);
      text-align: center;
      font-family: var(--font-serif);
      color: var(--ink-muted);
      letter-spacing: 0.06em;
      line-height: 2;
    }
    .redirect-note a { color: var(--accent); border-bottom: 1px solid var(--rule-2); }
  </style>
</head>
<body>
  <p class="redirect-note">
    這個分類已經併進主頁的分頁了，正在為你轉過去……<br />
    沒有自動跳轉的話，請點<a href="index.html">回到主頁</a>。
  </p>
</body>
</html>
